name: Correctif boutons Classroom exacts
on:
  push:
    paths:
      - .github/patch-classroom-exact-buttons.py
      - .github/workflows/patch-classroom-exact-buttons.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le correctif
        run: python .github/patch-classroom-exact-buttons.py
      - name: Valider la syntaxe
        run: |
          node --check classroom-rich-publish.user.js
          grep -q "@version      1.0.3" classroom-rich-publish.user.js
          grep -q "nouvelle annonce" classroom-rich-publish.user.js
          grep -q "txt === 'publier'" classroom-rich-publish.user.js
          grep -q "activateElement(postButton)" classroom-rich-publish.user.js
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom-rich-publish.user.js
          git diff --cached --quiet || git commit -m "Cible exactement Nouvelle annonce et Publier dans Classroom"
          git push
