name: Finalise publication Classroom en un clic
on:
  push:
    paths:
      - .github/workflows/finalize-classroom-oneclick.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour le texte de l’aperçu
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Remplissez le formulaire<br>et cliquez sur <em>Générer</em>'
          new='Remplissez le formulaire<br>puis choisissez le groupe à publier'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Valider
        run: |
          node --check app.js
          node --check classroom-rich-publish.user.js
          grep -q "Groupe 31" index.html
          grep -q "Groupe 32" index.html
          grep -q "Groupe 51" index.html
          grep -q "@version      1.0.9" classroom-rich-publish.user.js
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Finalise l’interface de publication Classroom"
          git push
