name: Correctif TrustedHTML Classroom
on:
  push:
    paths:
      - .github/patch-classroom-trustedhtml.py
      - .github/workflows/patch-classroom-trustedhtml.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le correctif
        run: python .github/patch-classroom-trustedhtml.py
      - name: Valider
        run: |
          node --check classroom-rich-publish.user.js
          grep -q "@version      1.0.7" classroom-rich-publish.user.js
          grep -q "return String(html || '').trim();" classroom-rich-publish.user.js
          if sed -n '/function classroomHtmlForRpc/,/^  }/p' classroom-rich-publish.user.js | grep -q 'innerHTML'; then exit 1; fi
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom-rich-publish.user.js
          git diff --cached --quiet || git commit -m "Corrige le blocage TrustedHTML de Classroom"
          git push
