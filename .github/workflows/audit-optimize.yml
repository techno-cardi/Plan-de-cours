name: Audit temporaire du generateur

on:
  push:
    paths:
      - '.github/workflows/audit-optimize.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit images et scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import pathlib, re
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.imgs=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='img': self.imgs.append(dict(attrs))
          p=P(); p.feed(s)
          print('=== IMAGES ===')
          for n,a in enumerate(p.imgs,1):
              src=a.get('src','')
              print('IMAGE',n,'id=',a.get('id'),'alt=',a.get('alt'),'src_len=',len(src),'data_uri=',src.startswith('data:'),'prefix=',src[:80])
          print('data_uri_total_chars=',sum(len(a.get('src','')) for a in p.imgs if a.get('src','').startswith('data:')))
          print('=== MAIN SCRIPT BOUNDS ===')
          pat=re.compile(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',re.S|re.I)
          matches=list(pat.finditer(s))
          for n,m in enumerate(matches):
              body=m.group('body'); attrs=m.group('attrs')
              if len(body)>10000:
                  line=s.count('\n',0,m.start())+1
                  print('large_script_index=',n,'line=',line,'bytes=',len(body.encode()),'attrs=',attrs.strip())
                  print('starts=',body[:180].replace('\n',' '))
                  print('ends=',body[-180:].replace('\n',' '))
          print('=== LARGE DATA URIS BY LINE ===')
          for i,l in enumerate(lines,1):
              if 'data:image/' in l: print('line',i,'length',len(l),'prefix',l[:220])
          PY
