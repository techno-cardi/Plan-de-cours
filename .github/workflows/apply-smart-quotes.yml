name: Apply French smart quotes

on:
  push:
    paths:
      - '.github/workflows/apply-smart-quotes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add French guillemet typing support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- French smart quotes -->'

          if marker in html:
              print('French smart quotes support is already present.')
              raise SystemExit(0)

          script = r'''<!-- French smart quotes -->
          <script>
          (() => {
            const nextFrenchQuote = (textBefore) => {
              let depth = 0;
              for (const ch of textBefore) {
                if (ch === '«') depth += 1;
                else if (ch === '»' && depth > 0) depth -= 1;
              }
              return depth > 0 ? '»' : '«';
            };

            const emitInput = (element, text) => {
              let inputEvent;
              try {
                inputEvent = new InputEvent('input', {
                  bubbles: true,
                  inputType: 'insertText',
                  data: text
                });
              } catch (error) {
                inputEvent = new Event('input', { bubbles: true });
              }
              element.dispatchEvent(inputEvent);
            };

            document.addEventListener('beforeinput', (event) => {
              if (event.inputType !== 'insertText' || event.data !== '"') return;

              const target = event.target;
              const isTextInput = target instanceof HTMLInputElement &&
                ['text', 'search'].includes((target.type || 'text').toLowerCase());

              if (target instanceof HTMLTextAreaElement || isTextInput) {
                if (target.disabled || target.readOnly ||
                    target.selectionStart === null || target.selectionEnd === null) return;

                const start = target.selectionStart;
                const end = target.selectionEnd;
                const quote = nextFrenchQuote(target.value.slice(0, start));

                event.preventDefault();
                target.setRangeText(quote, start, end, 'end');
                emitInput(target, quote);
                return;
              }

              const editor = target instanceof Element
                ? target.closest('[contenteditable="true"], [contenteditable="plaintext-only"]')
                : null;
              if (!editor) return;

              const selection = window.getSelection();
              if (!selection || selection.rangeCount === 0 || !editor.contains(selection.anchorNode)) return;

              const range = selection.getRangeAt(0);
              const before = range.cloneRange();
              before.selectNodeContents(editor);
              try {
                before.setEnd(range.startContainer, range.startOffset);
              } catch (error) {
                return;
              }

              const quote = nextFrenchQuote(before.toString());
              event.preventDefault();
              range.deleteContents();

              const node = document.createTextNode(quote);
              range.insertNode(node);
              range.setStartAfter(node);
              range.collapse(true);
              selection.removeAllRanges();
              selection.addRange(range);
              emitInput(editor, quote);
            }, true);
          })();
          </script>'''

          closing = html.rfind('</body>')
          if closing == -1:
              raise SystemExit('Could not find the closing </body> tag in index.html.')

          html = html[:closing] + script + '\n' + html[closing:]
          path.write_text(html, encoding='utf-8')
          print('French smart quotes support inserted into index.html.')
          PY

      - name: Commit the targeted change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajoute les guillemets français automatiques"
          git push
