name: Patch Classroom v1.0.8
on:
  push:
    paths:
      - .github/patch-v108.py
      - .github/workflows/patch-v108.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/patch-v108.py
      - name: Validate
        run: |
          node --check classroom-rich-publish.user.js
          grep -q "@version      1.0.8" classroom-rich-publish.user.js
          grep -q "aucun brouillon automatiquement" classroom-rich-publish.user.js
          grep -q "postButton.click()" classroom-rich-publish.user.js
      - name: Create versioned installer
        run: cp classroom-rich-publish.user.js classroom-rich-publish-v1.0.8.user.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom-rich-publish.user.js classroom-rich-publish-v1.0.8.user.js
          git commit -m "Corrige les emojis et la publication Classroom" || exit 0
          git push
