name: Correctif détection annonces Classroom
on:
  push:
    paths:
      - .github/patch-classroom-composer.py
      - .github/workflows/patch-classroom-composer.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le correctif
        run: python .github/patch-classroom-composer.py
      - name: Valider le JavaScript
        run: |
          node --check classroom-rich-publish.user.js
          grep -q "@version      1.0.2" classroom-rich-publish.user.js
          grep -q "function composerScore" classroom-rich-publish.user.js
          grep -q "function activateElement" classroom-rich-publish.user.js
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom-rich-publish.user.js
          git commit -m "Améliore la détection du bloc d’annonce Classroom" || exit 0
          git push
