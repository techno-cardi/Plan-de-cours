name: Validation temporaire du script Classroom
on:
  push:
    paths:
      - classroom-rich-publish.user.js
      - .github/workflows/validate-classroom-rich.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe JavaScript
        run: node --check classroom-rich-publish.user.js
      - name: Vérifier les garde-fous
        run: |
          grep -q "PENDING_KEY" classroom-rich-publish.user.js
          grep -q "insertRichHtml" classroom-rich-publish.user.js
          grep -q "findPostButton" classroom-rich-publish.user.js
          grep -q "status = 'submitted'" classroom-rich-publish.user.js
