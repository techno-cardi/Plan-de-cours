name: Ajout des listes propres

on:
  push:
    paths:
      - '.github/workflows/add-special-lists.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer et valider
        run: python3 .github/add-special-lists.py
      - name: Committer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git diff --cached --stat
          git commit -m "Ajoute les listes à tirets et numérotées"
          git push
