name: Correctif Classroom riche
on:
  push:
    paths:
      - .github/patch-classroom-rich.py
      - .github/workflows/patch-classroom-rich.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le correctif
        run: python3 .github/patch-classroom-rich.py
      - name: Valider
        run: |
          node --check classroom-rich-publish.user.js
          grep -q "@version      1.0.1" classroom-rich-publish.user.js
          grep -q "if (!preview || !copyBtn) return;" classroom-rich-publish.user.js
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom-rich-publish.user.js
          git commit -m "Corrige l’initialisation de l’automatisation Classroom"
          git push
