name: Optimisation validee du generateur

on:
  push:
    paths:
      - '.github/workflows/optimize-v2.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer et valider
        run: python3 .github/optimize_plan.py
      - name: Committer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js assets/
          git diff --cached --stat
          git commit -m "Optimise le générateur et la typographie française"
          git push
