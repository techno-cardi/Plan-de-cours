name: Audit final Classroom v1.0.10
on:
  push:
    paths:
      - .github/patch-classroom-v1010.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer les correctifs
        run: python .github/patch-classroom-v1010.py
      - name: Valider JavaScript et invariants
        run: |
          node --check app.js
          node --check classroom-rich-publish.user.js
          grep -q '@version      1.0.10' classroom-rich-publish.user.js
          grep -q "latestGeneratedText = '';" app.js
          grep -q "alternateLink: course.alternateLink" app.js
          grep -q 'emojiCoverageOkay' classroom-rich-publish.user.js
          grep -q 'HTMLButtonElement.prototype.click.call' classroom-rich-publish.user.js
          ! grep -q 'CLASSROOM_CREATE_TEMPLATE' classroom-rich-publish.user.js
          grep -q 'Groupe 31' index.html
          grep -q 'Groupe 32' index.html
          grep -q 'Groupe 51' index.html
      - name: Test statique du routage des groupes
        run: |
          node <<'NODE'
          function score(course, group) {
            const raw = `${course?.name || ''} ${course?.section || ''}`.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
            const g = String(group || '').trim();
            const escaped = g.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            if (new RegExp(`\\bGROUPE\\s*[-–—:]?\\s*${escaped}\\b`).test(raw)) return 120;
            if (new RegExp(`\\b(?:FRA|FRANCAIS|SAE)[^\\n]{0,30}(?:-|\\s)${escaped}\\b`).test(raw)) return 90;
            if (new RegExp(`(?:^|[^0-9])${escaped}(?:[^0-9]|$)`).test(raw)) return 50;
            return 0;
          }
          const cases = [
            [{name:'Français SAE — Groupe 31',section:'3e secondaire — Groupe 31'},'31',120],
            [{name:'Français SAE — Groupe 32',section:'3e secondaire — Groupe 32'},'32',120],
            [{name:'FRA5SE-51',section:''},'51',90],
            [{name:'Français SAE — Groupe 31',section:''},'51',0]
          ];
          for (const [c,g,want] of cases) {
            const got = score(c,g);
            if (got !== want) throw new Error(`routing ${g}: ${got} != ${want}`);
          }
          console.log('routing OK');
          NODE
      - name: Créer installateur versionné
        run: cp classroom-rich-publish.user.js classroom-rich-publish-v1.0.10.user.js
      - name: Committer
        run: |
          git config user.name "techno-cardi"
          git config user.email "tremblay.kevin@cscapitale.qc.ca"
          git add app.js index.html classroom-rich-publish.user.js classroom-rich-publish-v1.0.10.user.js
          git commit -m "Fiabilise la publication Classroom en un clic" || exit 0
          git push
